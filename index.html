<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10130e" />
    <meta name="description" content="Play chess against Stockfish in your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const root = document.documentElement;
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        let theme = 'system';
        let reduceMotion = false;
        try {
          const saved = JSON.parse(localStorage.getItem('chessflow-live.settings.v1') || 'null');
          if (saved?.version === 1 && ['system', 'light', 'dark'].includes(saved.settings?.theme)) theme = saved.settings.theme;
          if (saved?.version === 1 && typeof saved.settings?.reduceMotion === 'boolean') reduceMotion = saved.settings.reduceMotion;
        } catch { /* use system defaults when storage is unavailable */ }
        const applyTheme = () => {
          root.dataset.theme = theme;
          root.dataset.effectiveTheme = theme === 'dark' || (theme === 'system' && media.matches) ? 'dark' : 'light';
          root.dataset.reduceMotion = String(reduceMotion);
        };
        applyTheme();
        media.addEventListener?.('change', () => { if (theme === 'system') applyTheme(); });
      })();
    </script>
    <title>ChessFlow Live — Chess Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
