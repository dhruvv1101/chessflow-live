name: Server CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Run server tests
        working-directory: server
        run: python -m pytest -q
      - name: Build Docker image (no push or deploy)
        run: docker build --tag chessflow-engine:ci ./server
