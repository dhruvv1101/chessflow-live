app = "chessflow-engine"
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SF_THREADS = "2"
  SF_HASH_MB = "128"
  DAILY_REQUEST_CAP = "1000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
